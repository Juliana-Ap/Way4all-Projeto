<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logo_sb.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Way4all</title>
</head>

<body>
    <header class="cabecalho">
        <div class="logotipo"><img src="img/logo_cb.png" alt="logo Way4all com borda"></div>
        <form class="busca" data-search-form>
            <input type="text" name="busca" placeholder="Pesquisar...">
            <button type="submit">Buscar</button>
        </form>
        <a href="favoritos.html" title="Favoritos">
            <img src="img/coracao.png" alt="Favoritos">
        </a>
    </header>

    <main>
        <section class="galeria">
            <h2>Destinos</h2>
            <p data-message></p>
            <div class="destinos" data-destinations></div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Way4all. Todos os direitos reservados.</p>
    </footer>

    <script src="js/app.js" defer></script>
</body>

</html>
