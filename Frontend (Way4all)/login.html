<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logo_sb.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style_logcad.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Login - Way4all</title>
</head>

<body>
    <form data-login-form>
        <img src="img/logo_cb.png" alt="logo Way4all com borda"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">Senha:</label><br>
        <input type="password" id="password" name="password" required><br>
        <p data-message></p>
        <button type="submit">Login</button>
    </form>
    <a href="cadastro.html" class="linkcad">Nao tem uma conta? Cadastre-se aqui.</a>
    <script src="js/app.js" defer></script>
</body>

</html>
